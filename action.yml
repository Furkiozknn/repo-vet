name: "repo-vet"
description: "Fail the build when the README promises something the repository cannot deliver."
author: "Furkiozknn"

branding:
  icon: "check-circle"
  color: "green"

inputs:
  repository:
    description: "Repository to check, as owner/name. Defaults to the one running the workflow."
    required: false
    default: ${{ github.repository }}
  ref:
    description: >-
      Branch, tag or commit to read the README and files at. Empty (the
      default) means the commit this workflow runs on when the repository
      is the one running the workflow -- so a pull request is checked as it
      would merge -- and the default branch for any other repository.
    required: false
    default: ""
  token:
    description: "Token used for the GitHub API. The default job token is enough for a public repository."
    required: false
    default: ${{ github.token }}
  only:
    description: "Run only these checks (comma separated): install, links, badges, release, web, pages."
    required: false
    default: ""
  skip:
    description: "Skip these checks (comma separated)."
    required: false
    default: ""
  fail-on:
    description: "error (default), any, or none."
    required: false
    default: "error"
  web-limit:
    description: "How many outbound links to try."
    required: false
    default: "40"

outputs:
  findings:
    description: "Number of findings. Empty when there is no report (bad usage)."
    value: ${{ steps.vet.outputs.findings }}
  report:
    description: "Path of the JSON report, under RUNNER_TEMP so it never lands in your checkout."
    value: ${{ steps.vet.outputs.report }}

runs:
  using: "composite"
  steps:
    # `update-environment: false`: a composite action shares the caller's
    # job, and setup-python would otherwise put its 3.12 first on PATH for
    # every step after this one -- the job's own Python silently replaced.
    - uses: actions/setup-python@v6
      id: python
      with:
        python-version: "3.12"
        update-environment: false

    # Installed from the action's own checkout, so this works whether or not
    # repo-vet is on PyPI, and the version you pinned is the version that runs.
    # Into a venv of its own under RUNNER_TEMP, so nothing the job installs
    # later sees it, or is seen by it.
    - name: Install repo-vet
      id: install
      shell: bash
      env:
        RV_PYTHON: ${{ steps.python.outputs.python-path }}
        RV_SOURCE: ${{ github.action_path }}
      run: |
        set -euo pipefail
        venv="$RUNNER_TEMP/repo-vet-venv"
        "$RV_PYTHON" -m venv "$venv"
        py="$venv/bin/python"
        [ -x "$py" ] || py="$venv/Scripts/python.exe"      # Windows runners
        "$py" -m pip install --quiet --disable-pip-version-check "$RV_SOURCE"
        echo "python=$py" >> "$GITHUB_OUTPUT"

    - name: Vet
      id: vet
      shell: bash
      # Girdiler betige `${{ }}` ile gomulmuyor, ortam degiskeni olarak
      # geliyor: gomulen bir deger kabuk kodu olarak calisirdi.
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        RV_REPOSITORY: ${{ inputs.repository }}
        RV_ONLY: ${{ inputs.only }}
        RV_SKIP: ${{ inputs.skip }}
        RV_WEB_LIMIT: ${{ inputs.web-limit }}
        RV_FAIL_ON: ${{ inputs.fail-on }}
        RV_REF: ${{ inputs.ref }}
        RV_PY: ${{ steps.install.outputs.python }}
      run: |
        # Actions bu kabugu `-e` ile calistiriyor; `[ -n "" ] && ...` kalibi
        # bos girdide 1 dondugu icin adimi daha basinda oldururdu. `set +e`
        # da sart: yoksa repo-vet 1 dondugunde betik `kod=$?` satirina hic
        # varmiyor ve `findings` ciktisi tam bulgu oldugunda bos kaliyordu.
        set +e
        set -uo pipefail
        bayrak=()
        if [ -n "$RV_ONLY" ]; then bayrak+=(--only "$RV_ONLY"); fi
        if [ -n "$RV_SKIP" ]; then bayrak+=(--skip "$RV_SKIP"); fi
        # Kendi deposunu denetlerken varsayilan, is akisinin calistigi
        # commit: yoksa bir PR, README'yi bozsa bile ana dalin README'si
        # okunarak yesil geciyordu.
        if [ -z "$RV_REF" ] && [ "$RV_REPOSITORY" = "${GITHUB_REPOSITORY:-}" ]; then
          RV_REF="${GITHUB_SHA:-}"
        fi
        if [ -n "$RV_REF" ]; then bayrak+=(--ref "$RV_REF"); fi
        rapor="$RUNNER_TEMP/repo-vet.json"
        rm -f "$rapor"

        # TEK tarama. Once uc kosu vardi -- biri JSON icin, biri adim ozeti
        # icin, biri cikis kodu icin -- ve her biri dis baglantilari ayri ayri
        # deniyordu. Yavaslik ikincildi; asil sorun ucunun birbiriyle
        # celisebilmesiydi: cikti "0 bulgu" derken ucuncu kosu kirmizi
        # yanabilirdi. --json-out ayni kosunun raporunu dosyaya da yaziyor,
        # boylece sayi, ozet ve cikis kodu ayni olcumden geliyor.
        # Cikis kodu 3: depo hic okunamadi (yanlis slug, oran siniri,
        # reddedilen jeton). Bulgu yok ama temiz de degil; adim kirmizi yanar.
        "$RV_PY" -m repo_vet \
          "$RV_REPOSITORY" ${bayrak[@]+"${bayrak[@]}"} \
          --web-limit "$RV_WEB_LIMIT" \
          --json-out "$rapor" --markdown \
          --fail-on "$RV_FAIL_ON" >> "$GITHUB_STEP_SUMMARY"
        kod=$?

        if [ -f "$rapor" ]; then
          sayi=$("$RV_PY" -c "import json,sys;print(sum(r['finding_count'] for r in json.load(open(sys.argv[1]))))" "$rapor")
          echo "findings=$sayi" >> "$GITHUB_OUTPUT"
          echo "report=$rapor" >> "$GITHUB_OUTPUT"
        fi

        exit "$kod"
