name: CI

# Three things run here, and the third one is the point of the project:
#   1. the suite, on every supported Python
#   2. the package actually builds and passes twine's metadata check
#   3. repo-vet runs against its OWN repository
#
# The third is not a stunt. A tool that checks whether a README's promises
# hold has no business shipping a README whose promises do not.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py${{ matrix.python }})
    # 3.9 stays on 24.04: it is past end of life and newer runner images need
    # not carry it, while pyproject.toml still promises it.
    runs-on: ${{ matrix.python == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # No dependencies to install: the suite is standard library only and
      # never touches the network, so it runs the same on a train.
      - name: Run the suite
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | tee ciktisi.txt
          echo "=== $(grep -c '\.\.\. ok' ciktisi.txt) tests passed ==="

  package:
    name: package builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uvx twine check dist/*
      - run: |
          set -euo pipefail
          python3 -c "import zipfile,glob;w=glob.glob('dist/*.whl')[0];print(w);print(zipfile.ZipFile(w).read([n for n in zipfile.ZipFile(w).namelist() if n.endswith('METADATA')][0]).decode()[:600])"

  self:
    name: vets itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No `ref:` given, so on a pull request the action reads the README of
      # the commit being tested, not main's: a PR that breaks a link fails here.
      - id: vet
        uses: ./
        with:
          fail-on: error
      # The action reports a count and an exit code, and they have to come
      # from the same scan. They used to come from different ones, which is
      # how a summary saying "no findings" could sit next to a failed job.
      - name: The count the action reported agrees with the job passing
        env:
          FINDINGS: ${{ steps.vet.outputs.findings }}
          REPORT: ${{ steps.vet.outputs.report }}
        run: |
          set -eu
          echo "findings=$FINDINGS report=$REPORT"
          test -n "$FINDINGS"
          test -f "$REPORT"
          test ! -e repo-vet.json    # nothing written into the checkout
          python3 - <<'PY'
          import json, os
          d = json.load(open(os.environ["REPORT"], encoding="utf-8"))
          errors = sum(len([f for f in r["findings"] if f["level"] == "error"]) for r in d)
          assert errors == 0, "the step passed with %d errors in its own report" % errors
          assert d[0]["checks_run"], "nothing ran, yet the step passed"
          print("report and exit code agree: 0 errors, ran %s" % d[0]["checks_run"])
          PY

      # The other half of the contract: a repository that cannot be read
      # must turn the step red (exit 3), not hand CI a green tick.
      - id: missing
        uses: ./
        continue-on-error: true
        with:
          repository: Furkiozknn/this-repository-does-not-exist
      - name: An unreadable repository fails the step
        env:
          OUTCOME: ${{ steps.missing.outcome }}
          FINDINGS: ${{ steps.missing.outputs.findings }}
        run: |
          set -eu
          echo "outcome=$OUTCOME findings=$FINDINGS"
          test "$OUTCOME" = failure
          test "$FINDINGS" = 0
