# PyPI yayini -- Trusted Publishing (OIDC).
#
# Bu is akisinda API ANAHTARI YOKTUR ve olmamalidir. PyPI, GitHub'in
# imzaladigi kisa omurlu bir OIDC jetonuna guvenir; depoda saklanan,
# sizabilecek bir sir yok. Tek sartlari: `id-token: write` izni ve
# PyPI tarafinda bu depo/is akisi icin tanimlanmis bir yayinci.
#
# Ilk kullanimdan ONCE PyPI'da bir kez yapilacak (tarayicidan):
#   pypi.org -> Your projects -> Publishing -> Add a new pending publisher
#     Owner:            Furkiozknn
#     Repository:       repo-vet
#     Workflow name:    yayinla.yml
#     Environment name: pypi
#
# Etiket atmak paketi URETIR ve DOGRULAR; PyPI'a yukleme adimi bilerek
# elle tetiklenir, cunku bekleyen yayinci tanimlanmadan once etiket atmak
# kirmizi bir kosu birakiyordu. Yayinci tanimlandiktan sonra yayin:
#   Actions -> Yayinla -> Run workflow -> `yayinla` kutusunu isaretle
# Otomatik yayini geri istersen `yayinla` isindeki `if:` satirini
# `github.event_name == 'push' || inputs.yayinla` olarak geri al.

name: Yayinla

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      yayinla:
        description: "PyPI'a gercekten yukle (isaretlenmezse yalniz paketler)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: yayinla-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paketle:
    name: Paketi uret ve dogrula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7

      - name: Etiket ile pyproject surumu ayni mi
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          etiket="${GITHUB_REF_NAME#v}"
          bildirilen=$(python3 -c "import re;print(re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1))")
          echo "etiket=$etiket  pyproject=$bildirilen"
          test "$etiket" = "$bildirilen"

      - run: uv build
      - run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  yayinla:
    name: PyPI
    needs: paketle
    if: inputs.yayinla
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
