# Ayda bir, ekosistem basina TEK PR (groups). Her paket icin ayri PR,
# 25 Eylul 2026'da hesapta 36 acik Dependabot PR'i demekti; upload/download-
# artifact gibi birlikte yukselmesi gereken ciftler de ayni PR'da kalir.
# Kural: github.com/Furkiozknn/Furkiozknn schema/politika.py
# repo-vet has no runtime dependencies, so the only things that go stale are
# the actions its workflows and its own action.yml use.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
